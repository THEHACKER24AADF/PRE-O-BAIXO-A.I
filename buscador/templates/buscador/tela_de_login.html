{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'buscador/css/style.css' %}?v=3">
    <title>Tela de Login - Preço Baixo A.I</title>
    
    <!-- Importando a biblioteca oficial do Google -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <div class="Container">
        
        <div class="lado-esquerdo">
            <img src="{% static 'buscador/img/Boneco_cartao.png' %}" alt="Mascote Preço Baixo A.I segurando um cartão">
        </div>

        <div class="lado-direito">
            
            <!-- Formulário principal -->
            <form class="form" method="POST" action="{% url 'login' %}">
                
                <!-- Tag OBRIGATÓRIA no Django por segurança -->
                {% csrf_token %}
                
                <div class="form-header">
                    <div class="title">
                        <h1>Falta pouco para economizar!</h1>
                        <p>Como deseja continuar?</p>
                    </div>
                    
                    <div class="login-button">
                        <button type="button">Cadastre-se</button>
                    </div>
                </div>

                <!-- Botão Oficial do Google -->
                <div class="google-login-container" style="display: flex; justify-content: center; margin: 20px 0;">
                    
                    <!-- Configurações invisíveis do Google -->
                    <div id="g_id_onload"
                         data-client_id="432477846811-1m3ubdg0c0p1p3viijl39csdi6338nnu.apps.googleusercontent.com"
                         data-context="signin"
                         data-ux_mode="popup"
                         data-callback="lidarComLoginGoogle"
                         data-auto_prompt="false">
                    </div>
                    
                    <!-- O Botão Visual em si -->
                    <div class="g_id_signin"
                         data-type="standard"
                         data-shape="pill"
                         data-theme="outline"
                         data-text="signin_with"
                         data-size="large"
                         data-logo_alignment="left">
                    </div>
                </div>

                <!-- Função JavaScript inteligente (Pega o nome da conta do Google) -->
                <script>
                    function lidarComLoginGoogle(response) {
                        // Descriptografa o token de segurança para ler os dados da conta
                        const payload = JSON.parse(atob(response.credential.split('.')[1]));
                        const nomeRealGoogle = payload.given_name || payload.name;

                        // Cria um formulário invisível na hora para enviar esse nome para o Django
                        const form = document.createElement('form');
                        form.method = 'POST';
                        form.action = "{% url 'login' %}";

                        // Pega a chave de segurança (CSRF) obrigatória da página
                        const csrfInput = document.createElement('input');
                        csrfInput.type = 'hidden';
                        csrfInput.name = 'csrfmiddlewaretoken';
                        csrfInput.value = document.querySelector('[name=csrfmiddlewaretoken]').value;

                        // Coloca o nome do Google no input escondido
                        const nameInput = document.createElement('input');
                        nameInput.type = 'hidden';
                        nameInput.name = 'firstname';
                        nameInput.value = nomeRealGoogle;

                        // Envia os dados para a sua View (views.py)
                        form.appendChild(csrfInput);
                        form.appendChild(nameInput);
                        document.body.appendChild(form);
                        form.submit();
                    }
                </script>

                <div class="input-group">
                    
                    <div class="input-box">
                        <label for="firstname">Nome</label>
                        <!-- É daqui que o views.py pega o nome se a pessoa não usar o Google -->
                        <input id="firstname" type="text" name="firstname" placeholder="Digite seu nome" required>
                    </div>

                    <div class="input-box">
                        <label for="lastname">Sobrenome</label>
                        <input id="lastname" type="text" name="lastname" placeholder="Digite seu sobrenome" required>
                    </div>

                    <div class="input-box">
                        <label for="email">Email</label>
                        <input id="email" type="email" name="email" placeholder="Digite seu email" required>
                    </div>

                    <div class="input-box">
                        <label for="number">Número</label>
                        <input id="number" type="text" name="number" placeholder="(xx) xxxxx-xxxx" required>
                    </div>

                    <div class="input-box">
                        <label for="password">Senha</label>
                        <input id="password" type="password" name="password" placeholder="Digite sua senha" required>
                    </div>

                    <div class="input-box">
                        <label for="confirmpassword">Confirmar Senha</label>
                        <input id="confirmpassword" type="password" name="confirmpassword" placeholder="Confirme sua senha" required>
                    </div>

                </div> <!-- Fim do input-group único -->

                <div class="continue-button">
                    <button type="submit">Vamos lá</button>
                </div>
                
            </form>
        </div>
    </div>

</body>
</html>
