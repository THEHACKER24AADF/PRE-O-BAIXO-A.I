{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'buscador/css/style.css' %}?v=3">
    <title>Tela de Login - Preço Baixo A.I</title>
</head>
<body>

    <div class="Container">
        
        <div class="lado-esquerdo">
            <img src="{% static 'buscador/img/Boneco_cartao.png' %}" alt="Mascote Preço Baixo A.I segurando um cartão">
        </div>

        <div class="lado-direito">
            
            <!-- AQUI É A MÁGICA: Trocamos o <div class="form"> por um <form method="POST"> -->
            <form class="form" method="POST" action="{% url 'login' %}">
                
                <!-- Essa tag é OBRIGATÓRIA no Django por segurança! -->
                {% csrf_token %}
                
                <div class="form-header">
                    <div class="title">
                        <h1>Falta pouco para economizar!</h1>
                        <p>Como deseja continuar?</p>
                    </div>
                    
                    <div class="login-button">
                        <button type="button">Cadastre-se</button>
                    </div>
                </div>

                <div class="botoes-provisorios">
                    [ Botão Google ]<br><br>
                    [ Botão Email ]
                </div>

                <div class="input-group">
                    
                    <div class="input-box">
                        <label for="firstname">Nome</label>
                        <input id="firstname" type="text" name="firstname" placeholder="Digite seu nome" required>
                    </div>

                    <div class="input-box">
                        <label for="lastname">Sobrenome</label>
                        <input id="lastname" type="text" name="lastname" placeholder="Digite seu sobrenome" required>
                    </div>

                    <div class="input-box">
                        <label for="email">Email</label>
                        <input id="email" type="email" name="email" placeholder="Digite seu email" required>
                    </div>

                    <div class="input-box">
                        <label for="number">Número</label>
                        <input id="number" type="text" name="number" placeholder="(xx) xxxxx-xxxx" required>
                    </div>

                    <div class="input-box">
                        <label for="password">Senha</label>
                        <input id="password" type="password" name="password" placeholder="Digite sua senha" required>
                    </div>

                    <div class="input-box">
                        <label for="confirmpassword">Confirmar Senha</label>
                        <input id="confirmpassword" type="password" name="confirmpassword" placeholder="Confirme sua senha" required>
                    </div>

                </div> <!-- Fim do input-group único -->

                <!-- O botão voltou a ser do tipo "submit" para ativar o aviso de segurança do navegador -->
                <div class="continue-button">
                    <button type="submit">Vamos lá</button>
                </div>
                
            </form>
        </div>
    </div>

</body>
</html>
